; PlatformIO Project Configuration File
; OpenAksara ESP32 - High Performance Tuned Configuration

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ---- BOOST HARDWARE PERFORMANCES (RATA KANAN) ----
board_build.f_cpu = 240000000L      ; CPU Clock Maksimal 240MHz
board_build.f_flash = 80000000L     ; Flash SPI Clock 80MHz (baca aset 2x lipat lebih cepat)
board_build.flash_mode = qio         ; Mode Quad I/O 4-bit

lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@^9.2.2
	dfrobot/DFRobotDFPlayerMini@^1.0.6

build_flags = 
	-O2                              ; Optimasi kecepatan eksekusi kompiler GCC
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	
	; Driver Layar TFT_eSPI ILI9488
	-D USER_SETUP_LOADED=1
	-D ILI9488_DRIVER=1
	
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	
	-D TOUCH_CS=21
	-D SPI_TOUCH_FREQUENCY=2500000
	-D SPI_FREQUENCY=40000000
